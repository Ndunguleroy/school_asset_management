{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">

    <div class="mb-4">
        <h4 class="fw-bold mb-0">Add User</h4>
        <p class="text-muted mb-0">Create a new user account and send them an invitation email</p>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('admin.add_user') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control"
                            placeholder="e.g. John Kamau" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control"
                            placeholder="e.g. john.kamau@school.ac.ke" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="">Select role</option>
                            <option value="admin">Admin</option>
                            <option value="asset_officer">Asset Officer</option>
                            <option value="department_head">Department Head</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <select name="department_id" class="form-select">
                            <option value="">Select department</option>
                            {% for department in departments %}
                            <option value="{{ department.id }}">
                                {{ department.name }} - {{ department.school }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="alert alert-info mt-4">
                    <i class="bi bi-envelope"></i>
                    An invitation email will be sent to the user with instructions
                    on how to set up their password and activate their account.
                </div>

                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-person-plus"></i> Create Account and Send Email
                    </button>
                    <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
