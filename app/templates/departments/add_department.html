{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">

    <div class="mb-4">
        <h4 class="fw-bold mb-0">Add Department</h4>
        <p class="text-muted mb-0">Create a new department</p>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('departments.add') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Department Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Computer Science" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">School</label>
                        <input type="text" name="school" class="form-control" placeholder="e.g. School of Technology" required>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Save Department
                    </button>
                    <a href="{{ url_for('departments.index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
