{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-check fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Set Up Your Account</h3>
                    <p class="text-muted">Enter your work email and create a password to activate your account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.signup') }}">
                    <div class="mb-3">
                        <label class="form-label">Work Email Address</label>
                        <input type="email" name="email" class="form-control"
                            placeholder="Enter your work email" required>
                        <small class="text-muted">Use the email your administrator registered for you</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Create Password</label>
                        <div class="input-group">
                            <input type="password" name="password" id="password"
                                class="form-control" placeholder="Create a password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye" id="eyeIcon1"></i>
                            </button>
                        </div>
                        <small class="text-muted">Minimum 6 characters</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" id="confirm_password"
                                class="form-control" placeholder="Confirm your password" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirm">
                                <i class="bi bi-eye" id="eyeIcon2"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Activate Account
                    </button>
                </form>

                <hr>
                <p class="text-center text-muted mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const eyeIcon1 = document.getElementById('eyeIcon1');

    togglePassword.addEventListener('click', function() {
        if (password.type === 'password') {
            password.type = 'text';
            eyeIcon1.classList.remove('bi-eye');
            eyeIcon1.classList.add('bi-eye-slash');
        } else {
            password.type = 'password';
            eyeIcon1.classList.remove('bi-eye-slash');
            eyeIcon1.classList.add('bi-eye');
        }
    });

    const toggleConfirm = document.getElementById('toggleConfirm');
    const confirmPassword = document.getElementById('confirm_password');
    const eyeIcon2 = document.getElementById('eyeIcon2');

    toggleConfirm.addEventListener('click', function() {
        if (confirmPassword.type === 'password') {
            confirmPassword.type = 'text';
            eyeIcon2.classList.remove('bi-eye');
            eyeIcon2.classList.add('bi-eye-slash');
        } else {
            confirmPassword.type = 'password';
            eyeIcon2.classList.remove('bi-eye-slash');
            eyeIcon2.classList.add('bi-eye');
        }
    });
</script>
{% endblock %}
