{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">

    <div class="mb-4">
        <h4 class="fw-bold mb-0">Allocate Asset</h4>
        <p class="text-muted mb-0">Assign an available asset to a user or department</p>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('allocations.add') }}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Asset</label>
                        <select name="asset_id" class="form-select" required>
                            <option value="">Select available asset</option>
                            {% for asset in assets %}
                            <option value="{{ asset.id }}">
                                {{ asset.name }} - {{ asset.serial_number or 'No serial' }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Assign To</label>
                        <select name="user_id" class="form-select" required>
                            <option value="">Select user</option>
                            {% for user in users %}
                            <option value="{{ user.id }}">
                                {{ user.full_name }} - {{ user.role }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <select name="department_id" class="form-select" required>
                            <option value="">Select department</option>
                            {% for department in departments %}
                            <option value="{{ department.id }}">
                                {{ department.name }} - {{ department.school }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Borrow Start Date</label>
                        <input type="date" name="borrow_start_date" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Expected Return Date</label>
                        <input type="date" name="expected_return_date" class="form-control">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3"
                            placeholder="Optional notes about this allocation"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Allocate Asset
                    </button>
                    <a href="{{ url_for('allocations.index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
